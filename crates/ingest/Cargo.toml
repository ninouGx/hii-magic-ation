[package]
name = "hma-ingest"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
hma-core = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "fs", "io-util"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
