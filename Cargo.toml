[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# DuckDB C++ unity files with debug info exhaust 8 GB of RAM in a parallel build.
[profile.dev.package.libduckdb-sys]
debug = false
